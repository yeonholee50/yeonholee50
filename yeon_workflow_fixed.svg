<?xml version="1.0" encoding="UTF-8"?>
<svg width="920" height="280" viewBox="0 0 920 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @keyframes dash { to { stroke-dashoffset: 0; } }
      @keyframes pop { 0% { opacity: 0; transform: scale(0.9);} 100% { opacity: 1; transform: scale(1);} }
      .node { fill: #0a0a0a; stroke: #2dd4bf; stroke-width: 2; rx: 14; ry: 14; }
      .text { fill: #e5e7eb; font: 600 14px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,sans-serif; }
      .sub  { fill: #94a3b8; font: 500 12px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,sans-serif; }
      .edge { fill: none; stroke: #6ee7b7; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: dash 3.8s linear infinite; }
      .badge { fill: #111827; stroke: #64748b; stroke-width: 1.5; rx: 10; ry: 10; }
      .badgeText { fill: #cbd5e1; font: 600 12px Segoe UI, Roboto, sans-serif; }
      .glow { filter: drop-shadow(0 0 6px rgba(45,212,191,0.45)); }
    ]]></style>
  </defs>

  <!-- Badges -->
  <rect class="badge" x="16" y="16" width="180" height="26" />
  <text class="badgeText" x="26" y="33">#contracts-first</text>
  <rect class="badge" x="206" y="16" width="190" height="26" />
  <text class="badgeText" x="216" y="33">#deterministic-replays</text>
  <rect class="badge" x="406" y="16" width="160" height="26" />
  <text class="badgeText" x="416" y="33">#observability</text>
  <rect class="badge" x="576" y="16" width="140" height="26" />
  <text class="badgeText" x="586" y="33">#typed-config</text>
  <rect class="badge" x="726" y="16" width="178" height="26" />
  <text class="badgeText" x="736" y="33">#learn-in-public</text>

  <!-- Nodes -->
  <g transform="translate(30,80)" style="animation: pop .5s ease-out .0s both;">
    <rect class="node glow" width="190" height="64"/>
    <text class="text" x="12" y="28">Research the problem</text>
    <text class="sub"  x="12" y="46">stakeholders • constraints</text>
  </g>

  <g transform="translate(240,80)" style="animation: pop .5s ease-out .1s both;">
    <rect class="node glow" width="190" height="64"/>
    <text class="text" x="12" y="28">Whiteboard &amp; invariants</text>
    <text class="sub"  x="12" y="46">one-line goal • non-goals</text>
  </g>

  <g transform="translate(450,80)" style="animation: pop .5s ease-out .2s both;">
    <rect class="node glow" width="190" height="64"/>
    <text class="text" x="12" y="28">Pin contracts</text>
    <text class="sub"  x="12" y="46">schemas • units • times</text>
  </g>

  <g transform="translate(660,80)" style="animation: pop .5s ease-out .3s both;">
    <rect class="node glow" width="230" height="64"/>
    <text class="text" x="12" y="28">Design for boring failure</text>
    <text class="sub"  x="12" y="46">timeouts • retries • DLQ • CB</text>
  </g>

  <g transform="translate(140,170)" style="animation: pop .5s ease-out .4s both;">
    <rect class="node glow" width="210" height="64"/>
    <text class="text" x="12" y="28">Observability day‑0</text>
    <text class="sub"  x="12" y="46">logs • metrics • spans</text>
  </g>

  <g transform="translate(370,170)" style="animation: pop .5s ease-out .5s both;">
    <rect class="node glow" width="180" height="64"/>
    <text class="text" x="12" y="28">Small reversible slices</text>
    <text class="sub"  x="12" y="46">shadow • flag • rollback</text>
  </g>

  <g transform="translate(570,170)" style="animation: pop .5s ease-out .6s both;">
    <rect class="node glow" width="160" height="64"/>
    <text class="text" x="12" y="28">Replay‑driven</text>
    <text class="sub"  x="12" y="46">fixtures • determinism</text>
  </g>

  <g transform="translate(750,170)" style="animation: pop .5s ease-out .7s both;">
    <rect class="node glow" width="140" height="64"/>
    <text class="text" x="12" y="28">Operate &amp; learn</text>
    <text class="sub"  x="12" y="46">runbooks • notes</text>
  </g>

  <!-- Edges (animated) -->
  <path class="edge" d="M220,112 L240,112" />
  <path class="edge" d="M430,112 L450,112" />
  <path class="edge" d="M640,112 L660,112" />

  <path class="edge" d="M140,144 L190,170" />
  <path class="edge" d="M350,202 L370,202" />
  <path class="edge" d="M550,202 L570,202" />
  <path class="edge" d="M730,202 L750,202" />
</svg>
